name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 -t artemzatula/node-app-amd64 .
          docker push artemzatula/node-app-amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull Docker image
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@3.67.196.24 "docker pull artemzatula/node-app-amd64:latest"

      - name: Stop running container
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@3.67.196.24 "docker stop artemzatula/node-app-amd64 || true"
          ssh -o StrictHostKeyChecking=no ec2-user@3.67.196.24 "docker rm artemzatula/node-app-amd64 || true"

      - name: Run new container
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@3.67.196.24 "docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d"
